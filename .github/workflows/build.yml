name: Build Hakamo Nursing Assistant

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create fresh Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf app
          mkdir -p app/src/main/java/com/hakamo/nursingassistant
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Hakamo-Nursing-Assistant"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.hakamo.nursingassistant"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.hakamo.nursingassistant"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)

              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Hakamo Nursing Assistant</string>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Hakamo" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:statusBarColor">#07131F</item>
                  <item name="android:navigationBarColor">#07131F</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Hakamo">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/hakamo/nursingassistant/MainActivity.kt <<'EOF'
          package com.hakamo.nursingassistant

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          data class Section(
              val title: String,
              val subtitle: String,
              val icon: androidx.compose.ui.graphics.vector.ImageVector
          )

          private val sections = listOf(
              Section("دليل الأدوية", "معلومات الأدوية", Icons.Default.MedicalServices),
              Section("الحاسبات الطبية", "حسابات التمريض", Icons.Default.Calculate),
              Section("أساسيات التمريض", "المهارات الأساسية", Icons.Default.LocalHospital),
              Section("معلومات تمريضية", "شروحات مبسطة", Icons.Default.MenuBook),
              Section("المصطلحات الطبية", "عربي - English", Icons.Default.Translate),
              Section("الإجراءات التمريضية", "خطوات عملية", Icons.Default.Favorite),
              Section("الطوارئ والإسعافات", "تصرفات سريعة", Icons.Default.Emergency),
              Section("المذاكرة والمراجعة", "ملخصات وأسئلة", Icons.Default.School)
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { HakamoApp() }
              }
          }

          @Composable
          fun HakamoApp() {
              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Color(0xFF35D0BA),
                      secondary = Color(0xFF65B9FF),
                      background = Color(0xFF07131F),
                      surface = Color(0xFF0D1D2B)
                  )
              ) {
                  HomeScreen()
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun HomeScreen() {
              var search by remember { mutableStateOf("") }
              val filtered = sections.filter {
                  search.isBlank() ||
                      it.title.contains(search, true) ||
                      it.subtitle.contains(search, true)
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(MaterialTheme.colorScheme.background)
                      .padding(16.dp)
              ) {
                  Spacer(Modifier.height(20.dp))

                  Text(
                      "Hakamo",
                      color = MaterialTheme.colorScheme.primary,
                      fontSize = 34.sp,
                      fontWeight = FontWeight.ExtraBold
                  )

                  Text(
                      "مساعدك في كل ما يخص التمريض",
                      color = Color.White.copy(alpha = .85f),
                      fontSize = 16.sp
                  )

                  Spacer(Modifier.height(18.dp))

                  OutlinedTextField(
                      value = search,
                      onValueChange = { search = it },
                      modifier = Modifier.fillMaxWidth(),
                      singleLine = true,
                      placeholder = { Text("ابحث داخل التطبيق...") },
                      leadingIcon = {
                          Icon(Icons.Default.Search, contentDescription = "بحث")
                      },
                      shape = RoundedCornerShape(18.dp)
                  )

                  Spacer(Modifier.height(18.dp))

                  Text(
                      "الأقسام الرئيسية",
                      color = Color.White,
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.height(10.dp))

                  LazyVerticalGrid(
                      columns = GridCells.Fixed(2),
                      modifier = Modifier.fillMaxSize(),
                      horizontalArrangement = Arrangement.spacedBy(12.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp),
                      contentPadding = PaddingValues(bottom = 20.dp)
                  ) {
                      items(filtered) { SectionCard(it) }
                  }
              }
          }

          @Composable
          fun SectionCard(section: Section) {
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(145.dp),
                  shape = RoundedCornerShape(22.dp),
                  colors = CardDefaults.cardColors(
                      containerColor = MaterialTheme.colorScheme.surface
                  )
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(14.dp),
                      verticalArrangement = Arrangement.SpaceBetween
                  ) {
                      Icon(
                          section.icon,
                          contentDescription = null,
                          tint = MaterialTheme.colorScheme.primary,
                          modifier = Modifier.size(34.dp)
                      )

                      Column {
                          Text(
                              section.title,
                              color = Color.White,
                              fontSize = 16.sp,
                              fontWeight = FontWeight.Bold
                          )
                          Text(
                              section.subtitle,
                              color = Color.White.copy(alpha = .65f),
                              fontSize = 12.sp
                          )
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant-V1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
