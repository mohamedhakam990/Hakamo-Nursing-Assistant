name: Build Hakamo Nursing Assistant

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ZIP_FILE: Hakamo-Nursing-Assistant-V1-CLEAN.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE not found"
            exit 1
          }

          rm -rf extracted project
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"

          test -n "$SETTINGS_FILE" || {
            echo "ERROR: Gradle project not found"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          mkdir project
          cp -R "$PROJECT_DIR"/. project/

          test -f project/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hakamo-Nursing-Assistant
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
